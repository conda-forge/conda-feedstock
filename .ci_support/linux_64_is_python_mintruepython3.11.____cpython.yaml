channel_sources:
- conda-forge
channel_targets:
- conda-forge main
docker_image:
- quay.io/condaforge/linux-anvil-x86_64:alma10
is_python_min:
- true
pin_run_as_build:
  python:
    min_pin: x.x
    max_pin: x.x
python:
- 3.11.* *_cpython
python_min:
- '3.11'
target_platform:
- linux-64
zip_keys:
- - python
  - is_python_min
